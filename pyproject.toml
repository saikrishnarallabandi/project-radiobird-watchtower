[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiobird-watchtower"
version = "0.1.0"
description = "Public-data supply-chain anomaly monitor"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
